<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="SI사업2팀 주간업무 보고를 작성하고 취합하는 공간" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>주간업무 · SI사업2팀</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#dashboard" aria-label="주간업무 홈">
          <span class="brand-mark">W</span>
          <span><strong>workweek</strong><small>SI사업2팀 업무공간</small></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="주 메뉴">
          <button class="nav-link active" data-page="dashboard"><span class="nav-icon">▦</span>대시보드</button>
          <button class="nav-link" data-page="report"><span class="nav-icon">↗</span>주간보고 작성<span class="nav-count" id="myNavCount">1</span></button>
          <button class="nav-link" data-page="team" hidden><span class="nav-icon">♧</span>팀 현황</button>
          <button class="nav-link" data-page="admin" hidden><span class="nav-icon">▤</span>취합 및 내보내기</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="deadline-card"><span class="deadline-icon">◷</span><div><small>이번 주 제출 마감</small><strong id="deadlineText">목요일 오전 11:00</strong></div></div>
          <button class="nav-link settings-link" data-page="settings"><span class="nav-icon">⚙</span>알림 설정</button>
          <div class="profile" id="currentProfile"><span class="avatar avatar-blue">?</span><div><strong>로그인 전</strong><small>이름을 선택해 주세요</small></div><button class="more-button" data-action="logout" aria-label="로그아웃">↪</button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuButton" aria-label="메뉴 열기">☰</button>
          <div class="breadcrumbs"><span>SI사업2팀</span><span class="crumb-slash">/</span><strong id="crumbTitle">대시보드</strong></div>
          <div class="topbar-actions"><span class="period-pill" id="periodPill"><span class="status-dot"></span></span><button class="icon-button notification-button" id="notificationButton" data-page="settings" aria-label="알림 설정으로 이동" title="알림 설정">♧<i></i></button><div class="topbar-user" id="topbarUser" title="로그인 전"><span class="avatar avatar-blue" id="topbarAvatar">?</span><span class="topbar-user-name" id="topbarUserName">로그인 전</span></div></div>
        </header>
        <div id="pageContent" class="page-content"></div>
      </main>
    </div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
